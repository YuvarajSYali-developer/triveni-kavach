line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Depends() defaults are idiomatic FastAPI. UP017/UP038: style only.
# E501: the formatter governs line length; long user-facing message strings are kept whole.
ignore = ["B008", "UP017", "UP038", "E501"]

[lint.isort]
known-first-party = ["app", "tests"]
