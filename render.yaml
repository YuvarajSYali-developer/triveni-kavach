# Render Blueprint for the Triveni Kavach API (https://render.com/docs/blueprint-spec).
# The database is hosted on Neon and the website on Vercel; see docs/deployment.md.
services:
  - type: web
    name: triveni-kavach-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start, so the schema is always current. Proxy headers let
    # the login rate limiter see the real client address behind Render's load balancer.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Neon connection string when Render asks
      - key: CORS_ORIGINS
        sync: false # your Vercel address, e.g. https://triveni-kavach.vercel.app
      - key: DATA_GOV_IN_API_KEY
        sync: false # optional; leave empty until you have a key
      - key: ENABLE_TELEMETRY_SIMULATOR
        value: "false" # the public site shows real data only
      - key: ALLOW_DEVICE_SOURCE
        value: "false"
      - key: WEATHER_ENABLED
        value: "true"
